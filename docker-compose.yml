services:

  postgis:
    image: postgis/postgis:18-3.6-alpine
    container_name: postgis_desweb
    restart: "no"
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: gisdb
    ports:
      - "${DEVELOP_DOCKER_POSTGIS_FORWARDED_PORT}:5432"
    volumes:
      # Persistencia de datos
      - ./docker_files/data/postgres_data:/var/lib/postgresql
      - ./workspace:/workspace
      # Configuración personalizada (opcional, si tienes un postgresql.conf)
      # - ./postgres_config:/etc/postgresql
    healthcheck:
        test: [ "CMD", "pg_isready", "-q", "-d", "postgres", "-U", "admin" ]
        interval: 10s
        timeout: 5s
        retries: 5
    networks:
      - postgis

  pgadmin4:
    image: dpage/pgadmin4:9.12.0
    user: "5050:5050"
    env_file:
      - .env.dev
    volumes:
      - ./docker_files/data/pgadmin4/data:/var/lib/pgadmin
      - ./docker_files/data/pgadmin4/servers/servers.json:/pgadmin4/servers.json
      - ./workspace:/workspace
    ports:
      - "${DEVELOP_DOCKER_PGADMIN_FORWARDED_PORT}:80"
    restart: "no"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - postgis

  geoserver:
    image: docker.osgeo.org/geoserver:2.24.2
    restart: "no"
    ports:
      - ${DEVELOP_DOCKER_GEOSERVER_FORWARDED_PORT}:8080
    env_file:
        - .env
        - .env.dev
    volumes:
      - ./docker_files/data/geoserver/geoserver_data:/opt/geoserver_data/:Z
      - ./docker_files/data/geoserver/additional_libs:/opt/additional_libs:Z # by mounting this we can install libs from host on startup
    networks:
      - postgis

  djangoapi:
    restart: "no"
    #the folder of the Django project
    build: 
      context: docker_files/config_django
      args:
        - USER_ID=${DJANGOAPI_USER_ID}
        - GROUP_ID=${DJANGOAPI_GROUP_ID}
        - USERNAME=${DJANGOAPI_USERNAME}

    command: python djangoapi/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./proyecto_django:/usr/src/app:Z
      - ./workspace:/workspace
    ports:
      - "${DEVELOP_DOCKER_DJANGO_API_FORWARDED_PORT}:8000"
      #puerto para depuración remota, al poner djangoapi.settings.REMOTE_DEBUG = True
      - 6789:6789
    env_file:
      - .env.dev
    networks:
      - postgis

    #to ckeck if postgres is already ready. This service
    #will not start up to the posgis service is ready
    depends_on:
      postgis:
        condition: service_healthy
networks:
   postgis:
      driver: bridge
#coment
volumes:
  postgis-data:
    driver: local

#comentario
